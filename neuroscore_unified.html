<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NeuroScore — Scheda Unificata</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0f1117; --surface:#1a1d27; --surface2:#222536; --surface3:#2a2e42;
  --border:#2e3347; --accent:#4f8ef7; --accent-dim:rgba(79,142,247,0.13);
  --text:#e8eaf0; --text-dim:#8b91a8; --text-faint:#555e7a;
  --ok:#34d399; --warn:#fbbf24; --bad:#f87171; --bad-dim:rgba(248,113,113,0.13);
  --pp:#a78bfa;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:'IBM Plex Sans',sans-serif;font-size:14px;line-height:1.5;min-height:100vh}

/* ── LAYOUT ── */
.page{max-width:960px;margin:0 auto;padding:28px 18px 80px}

/* ── HEADER ── */
.header{margin-bottom:28px}
.ns-logo{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--accent);letter-spacing:.18em;text-transform:uppercase;margin-bottom:6px}
h1{font-size:24px;font-weight:600;margin-bottom:3px}
.header-sub{font-size:13px;color:var(--text-dim)}

/* ── DEMO CARD ── */
.demo-card{background:var(--surface);border:2px solid var(--accent);border-radius:12px;padding:20px 22px;margin-bottom:24px}
.demo-title{font-size:11px;font-family:'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);margin-bottom:14px}
.demo-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.demo-field label{font-size:11px;color:var(--text-dim);display:block;margin-bottom:4px}
.demo-field input,.demo-field select{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:14px;padding:8px 11px;outline:none;transition:border-color .2s}
.demo-field input:focus,.demo-field select:focus{border-color:var(--accent)}
.demo-field select option{background:var(--surface2)}
.demo-status{margin-top:12px;font-size:12px;font-family:'IBM Plex Mono',monospace;color:var(--text-dim)}
.demo-status.ready{color:var(--ok)}

/* ── DOMAIN SECTION ── */
.domain-section{margin-bottom:10px}
.domain-header{display:flex;align-items:center;gap:12px;padding:11px 16px;background:var(--surface);border:1px solid var(--border);border-radius:9px;cursor:pointer;user-select:none;transition:background .15s}
.domain-header:hover{background:var(--surface2)}
.domain-header.open{border-bottom-left-radius:0;border-bottom-right-radius:0;border-bottom-color:transparent}
.domain-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.domain-name{font-size:13px;font-weight:600;flex:1}
.domain-count{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text-dim)}
.domain-arrow{font-size:11px;color:var(--text-dim);transition:transform .2s}
.domain-header.open .domain-arrow{transform:rotate(90deg)}
.domain-body{background:var(--surface);border:1px solid var(--border);border-top:none;border-bottom-left-radius:9px;border-bottom-right-radius:9px;display:none;padding:8px 10px 10px}
.domain-body.open{display:block}

/* ── TEST CARD ── */
.test-card{background:var(--surface2);border:1px solid var(--border);border-radius:8px;margin-bottom:8px;overflow:hidden}
.test-card:last-child{margin-bottom:0}
.test-header{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;user-select:none;transition:background .15s}
.test-header:hover{background:var(--surface3)}
.test-header.open{background:var(--surface3)}
.test-num{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--accent);min-width:32px}
.test-name{font-size:13px;font-weight:500;flex:1}
.test-authors{font-size:11px;color:var(--text-dim)}
.test-arrow{font-size:10px;color:var(--text-dim);transition:transform .2s}
.test-header.open .test-arrow{transform:rotate(90deg)}
.test-body{display:none;padding:12px 14px 14px;border-top:1px solid var(--border)}
.test-body.open{display:block}

/* ── SCORE ROW ── */
.score-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--border)}
.score-row:last-of-type{border-bottom:none}
.score-lbl{flex:1;font-size:13px}
.score-lbl small{display:block;font-size:11px;color:var(--text-dim);margin-top:1px}
.score-inp{width:82px}
.score-inp input{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:5px;color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:13px;padding:6px 9px;outline:none;transition:border-color .2s;text-align:center}
.score-inp input:focus{border-color:var(--accent)}
.score-result{min-width:220px;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--text-dim)}
.score-result.ok{color:var(--ok)}
.score-result.warn{color:var(--warn)}
.score-result.bad{color:var(--bad)}
.score-result.pp{color:var(--pp)}

/* ── ES/PP BADGE ── */
.es-badge{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;padding:2px 8px;border-radius:4px;margin-left:6px}
.es0{background:var(--bad-dim);color:var(--bad);border:1px solid var(--bad)}
.es1{background:rgba(251,191,36,.1);color:var(--warn);border:1px solid var(--warn)}
.es2{background:rgba(251,191,36,.06);color:#d4901e;border:1px solid #d4901e}
.es3{background:rgba(52,211,153,.08);color:var(--ok);border:1px solid var(--ok)}
.es4{background:rgba(52,211,153,.13);color:var(--ok);border:1px solid var(--ok)}
.pp-badge{background:rgba(167,139,250,.13);color:var(--pp);border:1px solid var(--pp)}

/* ── TEST SUMMARY ── */
.test-summary{margin-top:10px;padding:10px 12px;background:var(--surface);border:1px solid var(--border);border-radius:6px;font-size:12px;color:var(--text-dim);display:none}
.test-summary.visible{display:block}
.summary-row{display:flex;justify-content:space-between;padding:2px 0}

/* ── GLOBAL OUTPUT ── */
.global-output{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--border);padding:14px 18px;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.btn{font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:500;padding:9px 20px;border-radius:7px;border:none;cursor:pointer;transition:opacity .2s,transform .1s}
.btn:hover:not(:disabled){opacity:.82}
.btn:active:not(:disabled){transform:scale(.97)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn-primary{background:var(--accent);color:#fff}
.btn-secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
.btn-clear{background:transparent;color:var(--text-dim);border:1px solid var(--border);font-size:12px;padding:7px 14px}

.asterisk{color:var(--bad);font-weight:700}
.sep{height:1px;background:var(--border);margin:8px 0}
.nota{font-size:11px;color:var(--text-faint);margin-top:8px;line-height:1.5}

/* ── ALERT ── */
.alert-demo{background:var(--bad-dim);border:1px solid var(--bad);border-radius:7px;padding:10px 14px;font-size:12px;color:var(--bad);margin-bottom:10px;display:none}

/* responsive */
@media(max-width:600px){
  .demo-grid{grid-template-columns:1fr 1fr}
  .score-result{display:none}
}
</style>
</head>
<body>
<div class="page">

<!-- HEADER -->
<div class="header">
  <div class="ns-logo">NeuroScore</div>
  <h1>Scheda Unificata</h1>
  <div class="header-sub">Inserisci i dati demografici, poi espandi i test somministrati</div>
</div>

<!-- DATI DEMOGRAFICI -->
<div class="demo-card">
  <div class="demo-title">Dati demografici paziente</div>
  <div class="demo-grid">
    <div class="demo-field">
      <label>Età (anni) *</label>
      <input type="number" id="g_eta" min="15" max="99" placeholder="es. 68" oninput="onDemoChange()">
    </div>
    <div class="demo-field">
      <label>Scolarità (anni) *</label>
      <input type="number" id="g_scol" min="0" max="30" placeholder="es. 13" oninput="onDemoChange()">
    </div>
    <div class="demo-field">
      <label>Sesso *</label>
      <select id="g_sesso" onchange="onDemoChange()">
        <option value="">—</option>
        <option value="F">Femmina</option>
        <option value="M">Maschio</option>
      </select>
    </div>
  </div>
  <div class="demo-status" id="demo-status">Inserire età, scolarità e sesso per attivare le correzioni</div>
</div>

<!-- DOMINI -->
<div id="domains-container"></div>

</div><!-- end .page -->

<!-- OUTPUT GLOBALE -->
<div class="global-output">
  <button class="btn btn-clear" onclick="clearAll()">Cancella tutto</button>
  <button class="btn btn-secondary" id="gbtn-lista"   disabled onclick="copiaListaGlobale()">Copia elenco completo</button>
  <button class="btn btn-primary"   id="gbtn-tabella" disabled onclick="copiaTabGlobale()">Copia tabella completa</button>
</div>

<script>
// ═══════════════════════════════════════════════════════════════════
// STRUTTURA DATI
// Ogni test ha: id, nome, autori, campi[]
// Ogni campo: id, label, hint, tipo ('score'|'pp'|'time'|'errors'), max, calcFn
// calcFn(grezzo, eta, scol, sesso) → {corretto, es, esito, alterato, cutoff}
// tipo 'pp' → mostra come "PP X" invece di ES
// ═══════════════════════════════════════════════════════════════════

// ── HELPERS ──────────────────────────────────────────────────────
function esFromTab(c, tab) {
  for (const [lim, es] of tab) { if (c <= lim) return es; }
  return 4;
}
function esLabel(es) {
  return es===0?'PATOLOGICO':es===1?'borderline':es===2?'borderline':es===3?'normale':'normale';
}
function geta()  { return parseFloat(document.getElementById('g_eta').value); }
function gscol() { return parseFloat(document.getElementById('g_scol').value); }
function gsesso(){ return document.getElementById('g_sesso').value; }
function demoOk(){ return !isNaN(geta()) && !isNaN(gscol()) && gsesso() !== ''; }

// ── DOMINI E TEST ─────────────────────────────────────────────────
const DOMINI = [
  {
    id:'screening', nome:'Screening globale', color:'#4f8ef7',
    tests:[
      { id:'moca', nome:'MoCA 8.1', autori:'Dapor, 2025',
        campi:[{ id:'tot', label:'Punteggio totale', hint:'0–30', tipo:'score',
          calc(g,e,s,sx){ /* ES Dapor 2025 – placeholder; usa cut-off 18 corretto */
            const c = g; // semplificato, file standalone ha la logica completa
            const es = c<=18?0:c<=21?1:c<=24?2:c<=26?3:4;
            return {corretto:c,es,esito:esLabel(es),alterato:es===0,cutoff:18};
          }
        }]
      },
    ]
  },
  {
    id:'memoria_lav', nome:'Memoria di lavoro', color:'#a78bfa',
    tests:[
      { id:'digit', nome:'Digit Span (avanti + indietro)', autori:'Monaco, 2013',
        campi:[
          {id:'fwd',label:'Span diretto',hint:'0–9',tipo:'score',
            calc(g,e,s,sx){const c=g+0;const es=c<=3?0:c<=4?1:c<=5?2:c<=6?3:4;return{corretto:c,es,esito:esLabel(es),alterato:es===0,cutoff:4};}},
          {id:'bwd',label:'Span inverso',hint:'0–8',tipo:'score',
            calc(g,e,s,sx){const c=g+0;const es=c<=2?0:c<=3?1:c<=4?2:c<=5?3:4;return{corretto:c,es,esito:esLabel(es),alterato:es===0,cutoff:3};}},
        ]
      },
      { id:'corsi', nome:'Corsi (avanti + indietro)', autori:'Monaco, 2013',
        campi:[
          {id:'fwd',label:'Span diretto',hint:'0–9',tipo:'score',
            calc(g,e,s,sx){const c=g+0;const es=c<=3?0:c<=4?1:c<=5?2:c<=6?3:4;return{corretto:c,es,esito:esLabel(es),alterato:es===0,cutoff:4};}},
          {id:'bwd',label:'Span inverso',hint:'0–8',tipo:'score',
            calc(g,e,s,sx){const c=g+0;const es=c<=2?0:c<=3?1:c<=4?2:c<=5?3:4;return{corretto:c,es,esito:esLabel(es),alterato:es===0,cutoff:3};}},
        ]
      },
      { id:'ln_wais', nome:'LN Riordinamento WAIS-IV', autori:'Orsini & Pezzuti, 2013',
        campi:[{id:'pp',label:'Punteggio ponderato',hint:'1–19',tipo:'pp',
          calc(g){return{corretto:g,es:null,esito:g<=7?'borderline/patologico':g<=9?'nella norma bassa':'nella norma',alterato:g<=7,cutoff:8,pp:g};}}]
      },
    ]
  },
  {
    id:'memoria_verb', nome:'Memoria verbale', color:'#34d399',
    tests:[
      { id:'babcock', nome:'Babcock — Raccontino', autori:'Carlesimo et al., 2002',
        campi:[
          {id:'imm',label:'Rievocazione immediata',hint:'0–23',tipo:'score',
            calc(g,e,s,sx){
              const delta = -0.167*(e-8.39)+0.107*(s==='F'?1:0);
              const c=g+delta;
              const es=c<=6.40?0:c<=8.97?1:c<=11.54?2:c<=14.11?3:4;
              return{corretto:c,es,esito:esLabel(es),alterato:es===0,cutoff:6.40};
            }},
          {id:'diff',label:'Rievocazione differita',hint:'0–23',tipo:'score',
            calc(g,e,s,sx){
              const delta=-0.182*(e-8.39)+0.145*(s==='F'?1:0);
              const c=g+delta;
              const es=c<=5.50?0:c<=8.33?1:c<=11.16?2:c<=14.00?3:4;
              return{corretto:c,es,esito:esLabel(es),alterato:es===0,cutoff:5.50};
            }},
        ]
      },
      { id:'ravlt', nome:'RAVLT', autori:'Ricci et al., 2022',
        campi:[
          {id:'imm',label:'Rievocazione immediata (tot A1-A5)',hint:'0–75',tipo:'score',
            calc(g,e,s,sx){const c=g;const es=c<=31?0:c<=38?1:c<=45?2:c<=52?3:4;return{corretto:c,es,esito:esLabel(es),alterato:es===0,cutoff:31};}},
          {id:'diff',label:'Rievocazione differita',hint:'0–15',tipo:'score',
            calc(g,e,s,sx){const c=g;const es=c<=5?0:c<=7?1:c<=9?2:c<=11?3:4;return{corretto:c,es,esito:esLabel(es),alterato:es===0,cutoff:5};}},
          {id:'ric',label:'Riconoscimento (hits − FA)',hint:'-15–15',tipo:'score',
            calc(g,e,s,sx){const c=g;const es=c<=8?0:c<=10?1:c<=12?2:c<=13?3:4;return{corretto:c,es,esito:esLabel(es),alterato:es===0,cutoff:8};}},
        ]
      },
    ]
  },
  {
    id:'memoria_vis', nome:'Memoria visiva', color:'#f7a94f',
    tests:[
      { id:'rey_copia', nome:'Figura di Rey — Copia + Richiamo', autori:'Gasparini et al., 2025',
        campi:[
          {id:'cop',label:'Copia',hint:'0–36',tipo:'score',
            calc(g,e,s,sx){
              const edu2=e*e; const age3=s*s*s;
              const c=g-(0.007*(edu2-168.79)-4.3e-6*(Math.pow(geta(),3)-283949.92));
              const es=c<=27.19?0:c<=31.00?1:c<=32.59?2:c<=33.75?3:4;
              return{corretto:c,es,esito:esLabel(es),alterato:es===0,cutoff:27.19};
            }},
          {id:'ir',label:'Richiamo immediato',hint:'0–36',tipo:'score',
            calc(g,e,s,sx){
              const gF=s==='F'?1:0;
              const c=g-(0.3046*(e-12.989)-0.001*(geta()*geta()-4320.82)+1.985*(gF-0.64));
              const es=c<=7.75?0:c<=11.19?1:c<=13.75?2:c<=16.01?3:4;
              return{corretto:c,es,esito:esLabel(es),alterato:es===0,cutoff:7.75};
            }},
          {id:'dr',label:'Richiamo differito (20 min)',hint:'0–36',tipo:'score',
            calc(g,e,s,sx){
              const gF=s==='F'?1:0;
              const c=g-(1.886*(Math.sqrt(e)-3.605)-0.146*(geta()-65.714)-1.931*(gF-0.64));
              const es=c<=7.73?0:c<=11.47?1:c<=13.70?2:c<=15.90?3:4;
              return{corretto:c,es,esito:esLabel(es),alterato:es===0,cutoff:7.73};
            }},
        ]
      },
    ]
  },
  {
    id:'attenzione', nome:'Attenzione', color:'#4fd8f7',
    tests:[
      { id:'tmt', nome:'TMT A e B', autori:'Siciliano, 2019',
        campi:[
          {id:'a',label:'TMT-A (secondi)',hint:'tempo',tipo:'time',
            calc(g,e,s,sx){
              const c=g+0.856*(geta()-56.8)-2.093*(gscol()-10.7);
              const cut=c<=76?'nella norma':c<=95?'borderline':'patologico';
              const es=c>95?0:c>76?1:4;
              return{corretto:c,es,esito:cut,alterato:c>95,cutoff:95};
            }},
          {id:'b',label:'TMT-B (secondi)',hint:'tempo',tipo:'time',
            calc(g,e,s,sx){
              const c=g+2.336*(geta()-56.8)-5.768*(gscol()-10.7);
              const es=c>282?0:c>213?1:4;
              return{corretto:c,es,esito:c>282?'patologico':c>213?'borderline':'normale',alterato:c>282,cutoff:282};
            }},
        ]
      },
      { id:'campanelle', nome:'Test delle Campanelle', autori:'Mancuso et al., 2019',
        campi:[
          {id:'asym',label:'Asimmetria (DX−SX)',hint:'−15…+15',tipo:'score',
            calc(g,e,s,sx){const ok=Math.abs(g)<3;return{corretto:g,es:ok?4:0,esito:ok?'nella norma':'PATOLOGICO',alterato:!ok,cutoff:'|val|≥3'};}},
          {id:'omis',label:'Omissioni totali',hint:'0–35',tipo:'errors',
            calc(g,e,s,sx){
              const exp=-0.83+0.025*geta()+(-0.042)*gscol();
              const max=exp+1.96*1.15;
              const cut=Math.floor(max)+1;
              const ok=g<cut;
              return{corretto:g,es:ok?4:0,esito:ok?'nella norma':'PATOLOGICO',alterato:!ok,cutoff:'≥'+cut};
            }},
          {id:'tempo',label:'Tempo (secondi)',hint:'0–300',tipo:'time',
            calc(g,e,s,sx){
              const max=Math.round(94.03+0.56*geta()+1.96*48.1);
              const ok=g<=max;
              return{corretto:g,es:ok?4:0,esito:ok?'nella norma':'PATOLOGICO',alterato:!ok,cutoff:'≤'+max+' s'};
            }},
        ]
      },
    ]
  },
  {
    id:'vel_elab', nome:'Velocità di elaborazione', color:'#f74fa0',
    tests:[
      { id:'sdmt', nome:'SDMT orale', autori:'Nocentini, 2006',
        campi:[{id:'tot',label:'Punteggio totale',hint:'0–110',tipo:'score',
          calc(g,e,s,sx){
            const c=g+0.448*(geta()-54.6)-0.801*(gscol()-9.7);
            const es=c<=29?0:c<=37?1:c<=45?2:c<=53?3:4;
            return{corretto:c,es,esito:esLabel(es),alterato:es===0,cutoff:29};
          }}]
      },
      { id:'dc_wais', nome:'DC Ricerca di simboli WAIS-IV', autori:'Orsini & Pezzuti, 2013',
        campi:[{id:'pp',label:'Punteggio ponderato',hint:'1–19',tipo:'pp',
          calc(g){const ok=g>=8;return{corretto:g,es:null,esito:ok?'nella norma':'borderline/pat.',alterato:!ok,cutoff:8,pp:g};}}]
      },
      { id:'rs_wais', nome:'RS Ricerca di simboli WAIS-IV', autori:'Orsini & Pezzuti, 2013',
        campi:[{id:'pp',label:'Punteggio ponderato',hint:'1–19',tipo:'pp',
          calc(g){const ok=g>=8;return{corretto:g,es:null,esito:ok?'nella norma':'borderline/pat.',alterato:!ok,cutoff:8,pp:g};}}]
      },
      { id:'so_wais', nome:'SO Sequenza di simboli WAIS-IV', autori:'Orsini & Pezzuti, 2013',
        campi:[{id:'pp',label:'Punteggio ponderato',hint:'1–19',tipo:'pp',
          calc(g){const ok=g>=8;return{corretto:g,es:null,esito:ok?'nella norma':'borderline/pat.',alterato:!ok,cutoff:8,pp:g};}}]
      },
    ]
  },
  {
    id:'funz_esec', nome:'Funzioni esecutive', color:'#f75f5f',
    tests:[
      { id:'tmt_b', nome:'TMT-B / A (rapporto)', autori:'Siciliano, 2019',
        campi:[{id:'ratio',label:'Rapporto B/A',hint:'es. 2.5',tipo:'score',
          calc(g,e,s,sx){const es=g>5?0:g>3.5?1:4;return{corretto:g,es,esito:esLabel(es),alterato:es===0,cutoff:5};}
        }]
      },
      { id:'mcst', nome:'MCST', autori:'Caffarra et al., 2004',
        campi:[
          {id:'cat',label:'Categorie',hint:'0–6',tipo:'score',
            calc(g,e,s,sx){const c=g;const es=c<=2?0:c<=3?1:c<=4?2:c<=5?3:4;return{corretto:c,es,esito:esLabel(es),alterato:es===0,cutoff:3};}},
          {id:'err',label:'Errori perseverativi',hint:'0–48',tipo:'errors',
            calc(g,e,s,sx){const c=g;const es=c>=18?0:c>=12?1:4;return{corretto:c,es,esito:c>=18?'PATOLOGICO':c>=12?'borderline':'normale',alterato:c>=18,cutoff:17};}},
        ]
      },
      { id:'stroop_breve', nome:'Stroop Breve', autori:'Caffarra, 2002',
        campi:[

  {
    id:'linguaggio', nome:'Linguaggio', color:'#4caf82',
    tests:[
      { id:'cowat', nome:'COWAT-FAS', autori:'Costa, 2014 / Gasparini, 2025',
        campi:[{id:'tot',label:'Totale F+A+S',hint:'0–150',tipo:'score',
          calc(g,e,s,sx){

          {id:'tot',label:'BAF Totale',hint:'0–∞',tipo:'score',
            calc(g,e,s,sx){const c=g+(16.12-(19.89-0.107*(geta()-68.03)+0.416*(e-8.42)));const es=c<9.28?0:c<11.41?1:c<13.98?2:c<15.85?3:4;return{corretto:c,es,esito:esLabel(es),alterato:es===0,cutoff:9.28};}},

            calc(g,e,s,sx){const gv=s==='F'?-1.59:1.59;const c=g-(33.29-1.11*(e-11.88)+gv-33.29)*-1;const corretto=g+(33.29-(33.29-1.11*(e-11.88)+gv));const es=corretto<17.77?0:corretto<21.07?1:corretto<26.91?2:corretto<33.16?3:4;return{corretto:corretto,es,esito:esLabel(es),alterato:es===0,cutoff:17.77};}},

            calc(g,e,s,sx){const gv=s==='F'?-2.19:2.19;const corretto=g+(41.27-(41.27-0.20*(geta()-55.95)-0.60*(e-11.88)+gv));const es=corretto<28.34?0:corretto<32.10?1:corretto<35.74?2:corretto<40.35?3:4;return{corretto:corretto,es,esito:esLabel(es),alterato:es===0,cutoff:28.34};}},
          {id:'alt',label:'Alternata',hint:'0–120',tipo:'score',
            calc(g,e,s,sx){const gv=s==='F'?-1.75:1.75;const corretto=g+(28.38-(28.38-0.23*(geta()-55.95)-0.96*(e-11.88)+gv));const es=corretto<12.70?0:corretto<17.89?1:corretto<22.74?2:corretto<27.65?3:4;return{corretto:corretto,es,esito:esLabel(es),alterato:es===0,cutoff:12.70};}},

  {

      },
      { id:'imitaz', nome:'Imitazione di Gesti', autori:'De Renzi et al., 1980/1986',
        campi:[{id:'tot',label:'Punteggio totale',hint:'0–24',tipo:'score',
          calc(g,e,s,sx){const c=g;const es=c<=15?0:c<=18?1:c<=21?2:c<=23?3:4;return{corretto:c,es,esito:esLabel(es),alterato:es===0,cutoff:16};}
        }]
      },
      { id:'orologio', nome:"Test dell'Orologio (ENB-2)", autori:'Mondini et al., 2011',
        campi:[
          {id:'num',label:'Numeri (0–4)',hint:'',tipo:'score',calc(g){return{corretto:g,es:null,esito:'',alterato:false,cutoff:''};}},
          {id:'disp',label:'Disposizione (0–4)',hint:'',tipo:'score',calc(g){return{corretto:g,es:null,esito:'',alterato:false,cutoff:''};}},
          {id:'lanc',label:'Lancette (0–2)',hint:'+0.5 diversa lunghezza',tipo:'score',
            calc(g,e,s,sx){
              // Totale calcolato dinamicamente nel render
              return{corretto:g,es:null,esito:'',alterato:false,cutoff:''};
            }},
        ]
      },
    ]
  },
  {
    id:'perc_vis', nome:'Percezione visiva', color:'#60a5fa',
    tests:[
      { id:'fig_aggrov', nome:'Figure Aggrovigliate (ENB-2)', autori:'Mondini et al., 2011',
        campi:[{id:'corr',label:'Figure corrette (0–50)',hint:'',tipo:'score',
          calc(g,e,s,sx){
            const eta=geta(),scol=gscol();
            const fascia=eta<=20?'15-20':eta<=30?'21-30':eta<=40?'31-40':eta<=50?'41-50':eta<=60?'51-60':eta<=70?'61-70':eta<=80?'71-80':'>80';
            const cutBassa={'15-20':26,'21-30':31,'31-40':32,'41-50':30,'51-60':25,'61-70':25,'71-80':11,'>80':9};
            const cutAlta ={'15-20':26,'21-30':35,'31-40':35,'41-50':32,'51-60':28,'61-70':27,'71-80':20,'>80':19};
            const cut=scol<=8?cutBassa[fascia]:cutAlta[fascia];

        campi:[{id:'gs',label:'Punteggio Globale (0–60)',hint:'',tipo:'score',
          calc(g,e,s,sx){
            const gv=s==='F'?-0.19:0.19;
            const c=g+0.190*(geta()-51.41)-0.40*(e-13.26)+gv;
            const es=c<=37.46?0:c<=41.62?1:c<=45.79?2:c<=49.95?3:4;
            return{corretto:c,es,esito:esLabel(es),alterato:es===0,cutoff:37.46};
          }}]
      },
      { id:'set', nome:'Story-Based Empathy Task (SET)', autori:'Dodich et al., 2015',
        campi:[
          {id:'gs',label:'SET-GS Globale (0–18)',hint:'',tipo:'score',
            calc(g,e,s,sx){const c=g-0.371*(Math.log(100-geta())-1.679)-0.277*(Math.sqrt(e)-3.619);const es=c<=8.29?0:c<=10.93?1:c<=13.57?2:c<=16.20?3:4;return{corretto:c,es,esito:esLabel(es),alterato:es===0,cutoff:8.29};}},
          {id:'ia',label:'SET-IA Intenzioni (0–6)',hint:'',tipo:'score',
            calc(g,e,s,sx){const c=g-0.203*(Math.log(100-geta())-1.679)-0.194*(Math.sqrt(e)-3.619);const es=c<=2.34?0:c<=3.56?1:c<=4.78?2:c<=5.99?3:4;return{corretto:c,es,esito:esLabel(es),alterato:es===0,cutoff:2.34};}},
          {id:'ea',label:'SET-EA Emozioni (0–6)',hint:'',tipo:'score',
            calc(g,e,s,sx){const c=g-0.317*(Math.log(100-geta())-1.679)-0.176*(Math.sqrt(e)-3.619);const es=c<=2.20?0:c<=3.43?1:c<=4.66?2:c<=5.88?3:4;return{corretto:c,es,esito:esLabel(es),alterato:es===0,cutoff:2.20};}},
          {id:'ci',label:'SET-CI Causale (0–6)',hint:'',tipo:'score',
            calc(g,e,s,sx){const c=g-0.332*(Math.log(100-geta())-1.679)-0.270*(Math.sqrt(e)-3.619);const es=c<=2.41?0:c<=3.35?1:c<=4.28?2:c<=5.22?3:4;return{corretto:c,es,esito:esLabel(es),alterato:es===0,cutoff:2.41};}},
        ]

    ]

          calc(g,e,s,sx){
            const c=g-(2.95*(Math.sqrt(e)-3.582)+4.42*(Math.log(100-geta())-3.467));
            const es=c<=22.53?0:c<=27.05?1:c<=29.79?2:c<=31.35?3:4;

// ═══════════════════════════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════════════════════════
function buildUI() {
  const container = document.getElementById('domains-container');
  DOMINI.forEach(dom => {
    const sec = document.createElement('div');
    sec.className = 'domain-section';
    sec.id = 'dom_' + dom.id;

    const hdr = document.createElement('div');
    hdr.className = 'domain-header';
    hdr.innerHTML = `
      <div class="domain-dot" style="background:${dom.color}"></div>
      <span class="domain-name">${dom.nome}</span>
      <span class="domain-count">${dom.tests.length} test</span>
      <span class="domain-arrow">▶</span>`;
    hdr.onclick = () => toggleDomain(dom.id);

    const body = document.createElement('div');
    body.className = 'domain-body';
    body.id = 'domBody_' + dom.id;

    dom.tests.forEach(test => {
      body.appendChild(buildTestCard(test, dom.color));
    });

    sec.appendChild(hdr);
    sec.appendChild(body);
    container.appendChild(sec);
  });
}

function buildTestCard(test, color) {
  const card = document.createElement('div');
  card.className = 'test-card';
  card.id = 'tc_' + test.id;

  const hdr = document.createElement('div');
  hdr.className = 'test-header';
  hdr.innerHTML = `
    <span class="test-num" style="color:${color}">●</span>
    <span class="test-name">${test.nome}</span>
    <span class="test-authors">${test.autori}</span>
    <span class="test-arrow">▶</span>`;
  hdr.onclick = () => toggleTest(test.id);

  const body = document.createElement('div');
  body.className = 'test-body';
  body.id = 'tb_' + test.id;

  test.campi.forEach(campo => {
    body.appendChild(buildScoreRow(test.id, campo));
  });

  // Summary
  const summ = document.createElement('div');
  summ.className = 'test-summary';
  summ.id = 'sum_' + test.id;
  body.appendChild(summ);

  card.appendChild(hdr);
  card.appendChild(body);
  return card;
}

function buildScoreRow(testId, campo) {
  const row = document.createElement('div');
  row.className = 'score-row';
  const isPP = campo.tipo === 'pp';
  const inputId = `inp_${testId}_${campo.id}`;
  const resId   = `res_${testId}_${campo.id}`;

  row.innerHTML = `
    <div class="score-lbl">
      ${campo.label}
      ${campo.hint ? `<small>${campo.hint}</small>` : ''}
    </div>
    <div class="score-inp">
      <input type="number" id="${inputId}" placeholder="—"
        ${isPP ? 'min="1" max="19"' : 'min="0"'}
        oninput="onScoreChange('${testId}','${campo.id}')">
    </div>
    <div class="score-result" id="${resId}">—</div>`;
  return row;
}

// ═══════════════════════════════════════════════════════════════════
// CALCOLO
// ═══════════════════════════════════════════════════════════════════
function onDemoChange() {
  const ok = demoOk();
  document.getElementById('demo-status').textContent =
    ok ? `✓ Eta ${geta()} anni · Scolarità ${gscol()} anni · ${gsesso()==='F'?'Femmina':'Maschio'}`
       : 'Inserire età, scolarità e sesso per attivare le correzioni';
  document.getElementById('demo-status').className = 'demo-status' + (ok?' ready':'');
  // Ricalcola tutto
  DOMINI.forEach(dom => dom.tests.forEach(test => {
    test.campi.forEach(campo => onScoreChange(test.id, campo.id, true));
  }));
}

function onScoreChange(testId, campoId, silent) {
  const test  = DOMINI.flatMap(d=>d.tests).find(t=>t.id===testId);
  const campo = test.campi.find(c=>c.id===campoId);
  const inp   = document.getElementById(`inp_${testId}_${campoId}`);
  const res   = document.getElementById(`res_${testId}_${campoId}`);
  if (!inp) return;

  const g = parseFloat(inp.value);
  if (isNaN(g)) { res.textContent='—'; res.className='score-result'; updateSummary(testId); updateGlobalBtn(); return; }

  if (!demoOk()) { res.textContent='(demo mancante)'; res.className='score-result'; return; }

  try {
    const r = campo.calc(g, gscol(), gsesso(), gscol());
    renderResult(res, r, campo.tipo);
  } catch(e) { res.textContent='err'; }

  updateSummary(testId);
  updateGlobalBtn();
}

function renderResult(el, r, tipo) {
  if (tipo === 'pp') {
    el.innerHTML = `PP <span class="es-badge pp-badge">${r.pp}</span>`;
    el.className = 'score-result pp';
    return;
  }
  if (r.es === null) { el.textContent='—'; el.className='score-result'; return; }
  const ast = r.alterato ? '<span class="asterisk">*</span>' : '';
  const corrStr = typeof r.corretto === 'number' ? r.corretto.toFixed(2) : r.corretto;
  el.innerHTML = `${corrStr}${ast} <span class="es-badge es${r.es}">PE ${r.es}</span>`;
  el.className = 'score-result ' + (r.es===0?'bad':r.es<=2?'warn':'ok');
}

function updateSummary(testId) {
  const test = DOMINI.flatMap(d=>d.tests).find(t=>t.id===testId);
  const summ = document.getElementById('sum_'+testId);
  if (!summ) return;

  const rows = test.campi.map(campo => {
    const inp = document.getElementById(`inp_${testId}_${campo.id}`);
    const g = inp ? parseFloat(inp.value) : NaN;
    if (isNaN(g) || !demoOk()) return null;
    try {
      const r = campo.calc(g, gscol(), gsesso(), gscol());
      const ast = r.alterato ? '*' : '';
      const pp  = campo.tipo === 'pp';
      const scoreStr = pp ? `PP ${g}` : `${g}${ast} → ${typeof r.corretto==='number'?r.corretto.toFixed(2):r.corretto}${ast}`;
      const esStr    = pp ? r.esito : `PE ${r.es} — ${r.esito}`;
      return `<div class="summary-row"><span>${campo.label}</span><span style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:${r.alterato?'var(--bad)':'var(--ok)'}">${scoreStr} &nbsp; ${esStr}</span></div>`;
    } catch { return null; }
  }).filter(Boolean);

  if (rows.length) {
    summ.innerHTML = rows.join('');
    summ.className = 'test-summary visible';
  } else {
    summ.className = 'test-summary';
  }
}

// ═══════════════════════════════════════════════════════════════════
// TOGGLE
// ═══════════════════════════════════════════════════════════════════
function toggleDomain(id) {
  const hdr  = document.querySelector(`#dom_${id} .domain-header`);
  const body = document.getElementById('domBody_'+id);
  hdr.classList.toggle('open');
  body.classList.toggle('open');
}
function toggleTest(id) {
  const hdr  = document.querySelector(`#tc_${id} .test-header`);
  const body = document.getElementById('tb_'+id);
  hdr.classList.toggle('open');
  body.classList.toggle('open');
}

// ═══════════════════════════════════════════════════════════════════
// OUTPUT GLOBALE
// ═══════════════════════════════════════════════════════════════════
function updateGlobalBtn() {
  const hasData = getGlobalData().length > 0;
  document.getElementById('gbtn-lista').disabled   = !hasData;
  document.getElementById('gbtn-tabella').disabled = !hasData;
}

function getGlobalData() {
  const out = [];
  DOMINI.forEach(dom => {
    dom.tests.forEach(test => {
      test.campi.forEach(campo => {
        const inp = document.getElementById(`inp_${test.id}_${campo.id}`);
        if (!inp) return;
        const g = parseFloat(inp.value);
        if (isNaN(g) || !demoOk()) return;
        try {
          const r = campo.calc(g, gscol(), gsesso(), gscol());
          out.push({ testNome:test.nome, autori:test.autori, campoLabel:campo.label,
            grezzo:g, corretto:r.corretto, es:r.es, esito:r.esito,
            alterato:r.alterato, cutoff:r.cutoff, tipo:campo.tipo, pp:r.pp });
        } catch {}
      });
    });
  });
  return out;
}

function copiaListaGlobale() {
  const data = getGlobalData();
  const lines = data.map(r => {
    const ast = r.alterato ? '*' : '';
    if (r.tipo === 'pp') return `${r.testNome} — ${r.campoLabel} (${r.autori}): PP ${r.grezzo}`;
    const corr = typeof r.corretto==='number' ? r.corretto.toFixed(2) : r.corretto;
    return `${r.testNome} — ${r.campoLabel} (${r.autori}): ${r.grezzo}${ast} → ${corr}${ast} (PE ${r.es} — ${r.esito})`;
  });
  navigator.clipboard.writeText(lines.join('\n'));
}

function copiaTabGlobale() {
  const data = getGlobalData();
  const rows = data.map(r => {
    const ast = r.alterato ? '*' : '';
    const corr = r.tipo==='pp' ? '—' : (typeof r.corretto==='number' ? r.corretto.toFixed(2)+ast : r.corretto+''+ast);
    const peCol = r.tipo==='pp' ? `PP ${r.grezzo}` : `PE ${r.es}`;
    return `<tr><td>${r.testNome} — ${r.campoLabel} (${r.autori})</td><td>${r.grezzo}${r.tipo!=='pp'?ast:''}</td><td>${corr}</td><td>${peCol}</td><td>${r.esito}</td><td>${r.cutoff}</td></tr>`;
  }).join('\n');
  const html = `<table border="1" cellpadding="5" cellspacing="0" style="border-collapse:collapse;font-family:Arial,sans-serif;font-size:13px">
<tr style="background:#e8eaf0"><th>Test</th><th>Grezzo</th><th>Corretto</th><th>PE / PP</th><th>Esito</th><th>Cut-off</th></tr>
${rows}
</table>`;
  navigator.clipboard.write([new ClipboardItem({'text/html': new Blob([html],{type:'text/html'})})]);
}

function clearAll() {
  document.querySelectorAll('.test-body input[type=number]').forEach(i => { i.value=''; });
  document.querySelectorAll('.score-result').forEach(e => { e.textContent='—'; e.className='score-result'; });
  document.querySelectorAll('.test-summary').forEach(e => { e.className='test-summary'; });
  updateGlobalBtn();
}

// INIT
buildUI();
</script>
</body>
